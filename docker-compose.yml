# ====================================
# Docker Compose - Gestión de Tareas
# Sesión 2 - Orquestación de contenedores
# ====================================

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: gestion_tareas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_tareas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación Django
  web:
    build: .
    container_name: gestion_tareas_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_ENGINE=postgresql
      - POSTGRES_DB=gestion_tareas
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=clave-secreta-docker-cambiar-en-produccion
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles

volumes:
  postgres_data:
  static_files:
