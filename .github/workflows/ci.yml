name: CI/CD Pipeline - Gestión de Tareas

on:
  push:
    branches: [ main, ci-setup ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: gestion-tareas-django

jobs:
  # ============================================
  # JOB 1: Tests (CI - Sesión 1)
  # ============================================
  test:
    name: 🧪 Ejecutar Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Ejecutar tests
        run: |
          python manage.py test --verbosity=2
        env:
          DJANGO_SECRET_KEY: 'test-secret-key-for-ci-pipeline'
          DJANGO_DEBUG: 'True'

      - name: ✅ Verificar estructura del proyecto
        run: |
          echo "=== Verificando estructura del proyecto ==="
          test -f manage.py && echo "✅ manage.py encontrado" || echo "❌ manage.py NO encontrado"
          test -d proyecto_config && echo "✅ proyecto_config/ encontrado" || echo "❌ proyecto_config/ NO encontrado"
          test -d tareas && echo "✅ tareas/ (app) encontrada" || echo "❌ tareas/ NO encontrada"
          test -f requirements.txt && echo "✅ requirements.txt encontrado" || echo "❌ requirements.txt NO encontrado"
          test -f Dockerfile && echo "✅ Dockerfile encontrado" || echo "❌ Dockerfile NO encontrado"
          test -f docker-compose.yml && echo "✅ docker-compose.yml encontrado" || echo "❌ docker-compose.yml NO encontrado"

  # ============================================
  # JOB 2: Build Docker (Sesión 2 y 3)
  # ============================================
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # Solo construir si los tests pasan

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Construir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:latest,${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 💾 Guardar imagen como artefacto
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > docker-image.tar.gz

      - name: 📤 Subir artefacto Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 5

  # ============================================
  # JOB 3: Simulación de Despliegue (Sesión 3)
  # ============================================
  deploy-simulation:
    name: 🚀 Simulación de Despliegue
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 📥 Descargar artefacto Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: 🐳 Cargar imagen Docker
        run: |
          docker load < docker-image.tar.gz
          docker images

      - name: 🚀 Simular despliegue con Docker Compose
        run: |
          # Crear directorio de despliegue simulado
          mkdir -p /tmp/deploy-simulation
          cp docker-compose.yml /tmp/deploy-simulation/
          cp -r . /tmp/deploy-simulation/app

          # Levantar servicios
          docker compose up -d

          # Esperar a que el servicio esté listo
          echo "⏳ Esperando que el servicio inicie..."
          sleep 10

          # Verificar que el contenedor está corriendo
          docker compose ps

          # Verificar que la aplicación responde
          curl -f http://localhost:8000/ || echo "⚠️ La app aún está iniciando..."

          # Limpiar
          docker compose down

      - name: 📝 Generar reporte de despliegue
        run: |
          echo "=== REPORTE DE DESPLIEGUE SIMULADO ==="
          echo "Fecha: $(date)"
          echo "Commit: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Imagen: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Estado: ✅ Despliegue simulado completado"
